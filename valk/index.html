<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy item</title>
<style>
  :root { --ink:#0d1114; --muted:#5b6470; --border:#e3e6ea; --blue:#4b52e8; --strike:#7a828c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:#00b140; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  .stage { display:flex; align-items:center; justify-content:center; }
  .modal { width:460px; background:#fbfcfd; border-radius:22px; padding:26px 26px 28px;
    box-shadow:0 24px 60px rgba(0,0,0,.22); }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .top h1 { font-size:33px; font-weight:800; color:var(--ink); letter-spacing:-.5px; }
  .close { width:26px; height:26px; cursor:pointer; }
  .close svg { width:100%; height:100%; stroke:var(--ink); stroke-width:2.4; }
  .item { display:flex; gap:18px; align-items:flex-start; }
  .thumb { width:118px; height:118px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:72px; }
  .thumb img { width:100%; height:auto; }
  .info { padding-top:4px; }
  .title { font-size:27px; font-weight:800; line-height:1.12; color:var(--ink); letter-spacing:-.3px; }
  .perm { font-size:20px; font-weight:600; color:var(--muted); margin:10px 0 8px; }
  .price { display:flex; align-items:center; gap:14px; }
  .price .now { display:flex; align-items:center; gap:5px; font-size:25px; font-weight:800; color:var(--ink); }
  .price .old { display:flex; align-items:center; gap:4px; font-size:21px; color:var(--strike); text-decoration:line-through; }
  .rbx { width:23px; height:23px; }
  .rbx.sm { width:20px; height:20px; }
  .old .rbx { opacity:.6; }
  .saving { margin-top:20px; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .saving-head { padding:15px 18px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
  .saving-head .left { display:flex; align-items:center; gap:10px; font-size:22px; }
  .saving-head .left b { font-weight:800; color:var(--ink); }
  .saving-head .left .amt { display:flex; align-items:center; gap:5px; font-weight:800; color:var(--ink); }
  .plus-badge { width:24px; height:24px; }
  .chev { width:20px; height:20px; stroke:var(--ink); stroke-width:2.4; fill:none; transition:transform .32s cubic-bezier(.4,0,.2,1); }
  .saving-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1); }
  .saving-body > .inner { overflow:hidden; }
  .saving.open .saving-body { grid-template-rows:1fr; }
  .saving.open .chev { transform:rotate(180deg); }
  .rows { padding:0 18px 16px; font-size:21px; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:6px; color:var(--ink); }
  .row.sub { padding-top:8px; }
  .row .val { display:flex; align-items:center; gap:5px; font-weight:700; }
  .divider { height:1px; background:var(--border); margin:14px 0 4px; }
  .row.total { font-weight:800; }
  .row.total .val { font-size:23px; }
  .wear { margin:22px 0; display:flex; align-items:center; gap:14px; }
  .box { width:24px; height:24px; border:2px solid #c2c8d0; border-radius:6px; }
  .wear span { font-size:22px; font-weight:700; color:#3d4650; }
  .buy { width:100%; border:none; cursor:pointer; background:var(--blue); color:#fff; font-size:25px; font-weight:700; padding:17px; border-radius:14px; transition:background .15s ease, opacity .15s ease; }
  .buy.pressed { background:#c9cbf5; color:#eef; }
  .modal { transition:opacity .3s ease, transform .3s ease; }
  .modal.hide { opacity:0; transform:scale(.96); pointer-events:none; }
  @media (max-width:520px) {
    .stage { transform: scale(0.62); transform-origin:center; }
  }
  @media (max-width:380px) {
    .stage { transform: scale(0.52); transform-origin:center; }
  }
  /* editor */
  #editBtn { position:fixed; top:14px; left:14px; z-index:50; width:44px; height:44px; border:none; border-radius:12px;
    background:rgba(0,0,0,.55); color:#fff; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #editPanel { position:fixed; top:14px; left:14px; z-index:49; width:280px; background:#1b1e24; color:#fff;
    border-radius:16px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.5); font-family:Arial,sans-serif;
    transform:translateX(-120%); opacity:0; transition:transform .3s ease, opacity .3s ease; }
  #editPanel.open { transform:translateX(0); opacity:1; }
  #editPanel h3 { font-size:15px; margin-bottom:12px; padding-left:52px; }
  #editPanel label { display:block; font-size:12px; opacity:.75; margin:10px 0 4px; }
  #editPanel input[type=text] { width:100%; padding:9px 10px; border:none; border-radius:8px; font-size:14px; background:#2a2e36; color:#fff; }
  #editPanel .switch { display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:14px; }
  #editPanel .toggle { width:46px; height:26px; border-radius:20px; background:#4b52e8; position:relative; cursor:pointer; transition:background .2s; }
  #editPanel .toggle.off { background:#555b66; }
  #editPanel .toggle::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s; }
  #editPanel .toggle.off::after { left:23px; }
</style>
</head>

  </div>
  <script>
    const saving = document.getElementById('saving');
    document.getElementById('savingHead').addEventListener('click', () => saving.classList.toggle('open'));
    const buyBtn = document.querySelector('.buy');
    const modal = document.querySelector('.modal');
    buyBtn.addEventListener('click', () => {
      buyBtn.classList.add('pressed');
      setTimeout(() => { modal.classList.add('hide'); }, 500);
    });

    // ---- Editor ----
    const $ = id => document.getElementById(id);
    const fmt = n => n.toLocaleString('en-US');
    const parse = v => parseInt((v+'').replace(/[^0-9]/g,'')) || 0;
    let plusOn = true;

    function render(){
      const title = $('inTitle').value || 'Item';
      const normal = parse($('inPrice').value);
      $('itemTitle').textContent = title;
      const img = $('inImg').value.trim();
      if(img) $('itemImg').src = img;

      if(plusOn){
        const benefit = Math.round(normal * 0.10);
        const final = normal - benefit;
        $('nowPrice').textContent = fmt(final);
        $('oldPrice').textContent = fmt(normal);
        $('oldPrice').parentElement.style.display = '';
        $('saveAmt').textContent = fmt(benefit);
        $('subVal').textContent = fmt(normal);
        $('benVal').textContent = fmt(benefit);
        $('totVal').textContent = fmt(final);
        saving.style.display = '';
      } else {
        $('nowPrice').textContent = fmt(normal);
        $('oldPrice').parentElement.style.display = 'none';
        saving.style.display = 'none';
      }
    }

    $('editBtn').addEventListener('click', () => $('editPanel').classList.toggle('open'));
    ['inTitle','inPrice','inImg'].forEach(id => $(id).addEventListener('input', render));
    $('plusToggle').addEventListener('click', () => {
      plusOn = !plusOn;
      $('plusToggle').classList.toggle('off', !plusOn);
      render();
    });
    render();
  </script>
